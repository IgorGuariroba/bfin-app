name: Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/igorguariroba/bfin-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/bfin-app/caddy

            cat > /opt/bfin-app/docker-compose.prod.yml << 'COMPOSEOF'
            services:
              app:
                image: ghcr.io/igorguariroba/bfin-app:${IMAGE_TAG:-latest}
                restart: unless-stopped
                env_file: .env
                depends_on:
                  db:
                    condition: service_healthy
                networks:
                  - internal
                logging:
                  driver: json-file
                  options:
                    max-size: "10m"
                    max-file: "3"

              db:
                image: postgres:16-alpine
                restart: unless-stopped
                environment:
                  POSTGRES_USER: ${POSTGRES_USER}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                  POSTGRES_DB: ${POSTGRES_DB}
                volumes:
                  - pgdata:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                networks:
                  - internal
                logging:
                  driver: json-file
                  options:
                    max-size: "10m"
                    max-file: "3"

              caddy:
                image: caddy:2.8-alpine
                restart: unless-stopped
                ports:
                  - "80:80"
                  - "443:443"
                  - "443:443/udp"
                volumes:
                  - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
                  - caddy_data:/data
                  - caddy_config:/config
                networks:
                  - internal
                logging:
                  driver: json-file
                  options:
                    max-size: "5m"
                    max-file: "2"

            networks:
              internal:

            volumes:
              pgdata:
              caddy_data:
              caddy_config:
            COMPOSEOF

            cat > /opt/bfin-app/caddy/Caddyfile << 'CADDYEOF'
            {
                email admin@bfincont.com.br
            }

            bfincont.com.br {
                encode zstd gzip
                reverse_proxy app:3000
            }
            CADDYEOF

            docker system prune -f
            cd /opt/bfin-app
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T app npx prisma migrate deploy
            docker image prune -f
