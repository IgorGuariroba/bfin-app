name: Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/igorguariroba/bfin-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_FARO_URL=${{ secrets.NEXT_PUBLIC_FARO_URL }}
          secrets: |
            faro_api_key=${{ secrets.FARO_API_KEY }}

      # Dispara redeploy no Dokploy via SSH (curl em localhost:3000), mantendo
      # o painel Dokploy privado (não exposto à internet). O compose usa a tag
      # :latest com pull_policy: always, então o Dokploy puxa a imagem recém-
      # publicada. As migrações Prisma rodam no entrypoint (prisma migrate deploy).
      - name: Trigger Dokploy deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            curl --fail --silent --show-error -X POST \
              http://localhost:3000/api/compose.deploy \
              -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"composeId":"CJWFSnkMzDc8Tw0cKQfVD"}'
