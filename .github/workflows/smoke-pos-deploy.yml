# ADR-0018 (#230): merge em master significa produção verificada.
# O push em master é o mesmo evento que faz o Dokploy deployar; este workflow
# espera a versão nova estar SERVIDA (polling do SHA no /api/health, não sleep)
# e roda o smoke (seam único, scripts/smoke.mjs) contra produção.
# Falha = Alerta (Página) no Discord + Detecção (Issue) com chave estável.
name: Smoke pós-deploy

on:
  push:
    branches: [master]

# Push novo supersede o anterior: a versão que interessa verificar é a mais nova.
concurrency:
  group: smoke-pos-deploy
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  BASE_URL: https://bfincont.com.br
  DETECTION_KEY: smoke-pos-deploy

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # smoke.mjs só precisa do dotenv — não paga npm ci inteiro.
      - name: Instala dependência do smoke
        run: npm install --no-save dotenv

      # Merge em rajada quebra a igualdade de SHA: o Dokploy clona o repositório
      # quando o deploy RODA, não quando o webhook chega. Com dois pushes em
      # sequência, o deploy do primeiro já builda o segundo — então produção NUNCA
      # vai servir o SHA do primeiro, e exigir igualdade transforma isso em alarme
      # falso de produção quebrada. Foi o que aconteceu em 06/10/2026: 9 merges do
      # Dependabot em 7 minutos, alarme no Discord e issue de detecção aberta com a
      # produção saudável (`/api/health` respondendo ok e servindo o commit mais novo).
      #
      # O invariante que interessa não é "produção serve exatamente o meu commit", é
      # "produção serve o meu commit ou algo mais novo que o inclui". Daí o compare
      # da API em vez da igualdade: `ahead` e `identical` passam, `behind` e
      # `diverged` continuam esperando (e estourando o prazo como falha real).
      - name: Espera o deploy do Dokploy servir o SHA novo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Push que não muda artefato não dispara deploy — e então produção nunca
          # vai servir esse SHA. Sem esta porta, o smoke trava os 20 min e pagina
          # falso. Já aconteceu em 08/07/2026 (aa857b6, só docs) e aconteceria com
          # qualquer merge restrito a `.github/**` (inclusive o do próprio fix que
          # introduziu esta checagem).
          #
          # Conservador de propósito: só os caminhos inequivocamente fora do
          # artefato dispensam a espera. Qualquer caminho desconhecido mantém o
          # comportamento antigo (esperar), para nunca pular a verificação de um
          # deploy que de fato vai acontecer.
          arquivos=$(curl -sS -m 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$GITHUB_SHA" \
            | jq -r '.files[]?.filename // empty')
          deploya=1
          if [ -n "$arquivos" ]; then
            deploya=0
            while IFS= read -r f; do
              # `*.test.*` e `__tests__/` entram aqui porque saíram dos watch paths
              # do serviço: mudança só de teste não entra no artefato, logo não
              # dispara deploy. Manter as duas listas em sincronia é necessário —
              # se os watch paths mudarem, esta lista tem de mudar junto (ou o
              # smoke volta a esperar por um SHA que nunca vai existir).
              case "$f" in
                docs/*|.github/*|.pi/*|*.md|*.test.ts|*.test.tsx|*.test.js|*.test.jsx|*/__tests__/*) ;;
                *) deploya=1; break ;;
              esac
            done <<< "$arquivos"
          fi
          if [ "$deploya" = "0" ]; then
            echo "Push não toca artefato (só docs/CI/markdown): nenhum deploy a esperar. Indo direto ao smoke."
            exit 0
          fi
          echo "Aguardando $BASE_URL servir sha=$GITHUB_SHA (ou algo mais novo que o inclua)..."
          deadline=$(( $(date +%s) + 1200 ))
          while true; do
            sha=$(curl -sf -m 10 "$BASE_URL/api/health" | jq -r '.sha // "sem-campo-sha"' || echo "health-inacessivel")
            if [ "$sha" = "$GITHUB_SHA" ]; then
              echo "Versão exata no ar (sha=$sha)."
              break
            fi
            if [ "$sha" != "sem-campo-sha" ] && [ "$sha" != "health-inacessivel" ]; then
              # curl em vez de `gh api`: em 404 o `gh` imprime o corpo do erro no
              # stdout e sujaria a variável. `.status // "indeterminado"` é determinístico.
              relacao=$(curl -sS -m 15 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/compare/$GITHUB_SHA...$sha" \
                | jq -r '.status // "indeterminado"')
              # O corpo de erro 404 da API também traz uma chave `status` (valor "404"),
              # então o `//` acima não basta: só os quatro status do compare valem.
              case "$relacao" in
                ahead|behind|identical|diverged) ;;
                *) relacao="indeterminado" ;;
              esac
              if [ "$relacao" = "ahead" ] || [ "$relacao" = "identical" ]; then
                echo "Produção serve $sha, que já inclui $GITHUB_SHA (compare=$relacao) — deploy superado por um push mais novo. Seguindo para o smoke."
                break
              fi
              echo "produção serve sha=$sha (compare=$relacao vs $GITHUB_SHA) — aguardando 15s..."
            else
              echo "produção serve sha=$sha — aguardando 15s..."
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::Timeout (20min): produção serve sha=$sha e ele não contém $GITHUB_SHA. Deploy do Dokploy não concluiu, falhou, ou o health não expõe o SHA." | tee smoke.log
              exit 1
            fi
            sleep 15
          done

      - name: Smoke contra produção
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee smoke.log
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_PROD_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PROD_PASSWORD }}

      # Falha em produção é Alerta (Página): exige ação em minutos (ADR-0008).
      - name: Alerta no Discord (#bfin-health)
        if: failure()
        run: |
          jq -n --arg content "🚨 **Smoke pós-deploy FALHOU em produção** — commit \`${GITHUB_SHA:0:7}\` pode ter quebrado a espinha dorsal (health/login/totais/webhook billing). Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{content: $content}' \
            | curl -sf -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" -H 'content-type: application/json' -d @-

      # A mesma falha vira Detecção (Issue) com chave estável: dedup por título,
      # labels e template do detection-playbook — a routine horária sabe operar.
      - name: Abre/atualiza issue de detecção
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log=$(tail -c 3000 smoke.log 2>/dev/null || echo "sem log capturado")
          body="**Detecção automática** (smoke pós-deploy, ADR-0018) — chave \`detection:$DETECTION_KEY\`

          **O que foi observado:** o smoke contra produção falhou após o deploy do commit \`$GITHUB_SHA\`.
          **Por que importa:** merge em master significa produção verificada — a espinha dorsal (health, login, leitura financeira, guard do webhook de billing) pode estar quebrada para usuários agora.
          **Provável causa / onde olhar:** diff do commit \`${GITHUB_SHA:0:7}\`, [log do run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), painel do Dokploy.
          **Log do passo que falhou:**
          \`\`\`
          $log
          \`\`\`

          _Gerado automaticamente pelo workflow smoke-pos-deploy. Se for ruído, feche e ajuste o workflow._"
          existing=$(gh issue list --state open --search "[detection:$DETECTION_KEY] in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "[detection:$DETECTION_KEY] smoke pós-deploy falhou em produção" \
              --label detection --label "detection:state" \
              --body "$body"
          fi

      # detection:state fecha quando a condição limpa — e smoke verde É a
      # condição limpando; não precisa esperar a varredura horária.
      - name: Fecha issue de detecção se a condição limpou
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "[detection:$DETECTION_KEY] in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Resolvido: smoke pós-deploy verde no commit \`$GITHUB_SHA\` ($(date -u +%Y-%m-%dT%H:%M:%SZ))."
          fi
