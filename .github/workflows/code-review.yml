name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the diff of this pull request and comment ONLY on critical problems.

            Critical means: security vulnerabilities, data loss risks, broken auth/authorization,
            obvious bugs that will crash in production, missing input validation on user-facing
            endpoints, leaked secrets, SQL/NoSQL injection, missing CSRF/HMAC where required.

            Do NOT comment on: style, naming, minor refactors, missing tests, performance
            micro-optimizations, or anything that is a matter of taste.

            If there are zero critical issues, post a single short comment saying so.
            Otherwise, post one comment per critical issue, each referencing the file and line.
            Be concise — no preamble, no summary.
          claude_args: '--allowed-tools "Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*)"'
