name: CI

on:
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Prisma client é gitignored (gerado em src/generated/prisma).
      # generate não toca o banco — DATABASE_URL dummy basta (igual ao Dockerfile).
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # next build sai com exit 0 mesmo logando erros de prerender (ex.: ReferenceError
      # 'window is not defined' ao renderizar no servidor). Capturamos o log e
      # reprovamos se algum desses marcadores aparecer — pega regressão de SSR.
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -E "ReferenceError|is not defined|Error occurred prerendering" build.log; then
            echo "::error::Erro de prerender detectado no build"
            exit 1
          fi
        env:
          NEXT_TELEMETRY_DISABLED: "1"
