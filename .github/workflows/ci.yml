name: CI

on:
  pull_request:
    branches: [master]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep (SAST)
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    services:
      # Banco para a suíte de testes (integração real, como no dev local).
      # Mesma major do docker-compose.yml.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bfin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Knip (código morto)
        run: npm run knip

      - name: jscpd (duplicação)
        run: npm run jscpd

      # ADR-0017: os testes de integração do MCP chamam o bfin-backend de
      # verdade via HTTP (gateway), não mock — sobe o backend real contra o
      # mesmo Postgres de teste antes de rodar a suíte.
      - name: Checkout bfin-backend
        uses: actions/checkout@v4
        with:
          repository: IgorGuariroba/bfin-backend
          path: bfin-backend-ci

      - name: Build e sobe o bfin-backend
        working-directory: bfin-backend-ci
        run: |
          npm ci
          npm run db:migrate
          npm run build
          node dist/server.js &
          npx wait-on http://localhost:3001/health
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bfin_test
          INTERNAL_API_SECRET: ci-secret
          # Dummy: faz o guard do webhook responder 401 (não 500 fail-closed)
          # ao probe não assinado do smoke (ADR-0018, #228).
          MERCADO_PAGO_WEBHOOK_SECRET: ci-mp-secret

      # Rede de segurança do ADR-0013: os testes (unitários do core + integração
      # contra Postgres) precisam ficar verdes a cada fatia da migração.
      # Secrets exigidos pelos testes são stubados neles próprios (vi.stubEnv).
      - name: Test
        run: |
          node scripts/db-migrate.mjs
          npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bfin_test
          BACKEND_URL: http://localhost:3001
          INTERNAL_API_SECRET: ci-secret

      # next build sai com exit 0 mesmo logando erros de prerender (ex.: ReferenceError
      # 'window is not defined' ao renderizar no servidor). Capturamos o log e
      # reprovamos se algum desses marcadores aparecer — pega regressão de SSR.
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -E "ReferenceError|is not defined|Error occurred prerendering" build.log; then
            echo "::error::Erro de prerender detectado no build"
            exit 1
          fi
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # ADR-0018 (#228): o CI valida o app SERVIDO, não só buildado — sobe o
      # next start (build de produção) com o bfin-backend real já de pé e roda
      # o smoke (seam único, o mesmo script que o pós-merge roda contra prod).
      # O usuário sintético nasce do seed (demo@bfin.app).
      - name: Smoke (app servido)
        run: |
          npx tsx scripts/seed.mts
          npx next start -p 3000 &
          npx wait-on -t 60000 http://localhost:3000/api/health
          npm run smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bfin_test
          BACKEND_URL: http://localhost:3001
          INTERNAL_API_SECRET: ci-secret
          AUTH_SECRET: ci-auth-secret-so-para-o-smoke!!
          AUTH_TRUST_HOST: "true"
          BASE_URL: http://localhost:3000
          SMOKE_EMAIL: demo@bfin.app
          SMOKE_PASSWORD: demo123
          # Sem Traefik no CI, o path público do webhook é servido direto pelo backend.
          SMOKE_WEBHOOK_URL: http://localhost:3001/api/webhook/mercadopago
