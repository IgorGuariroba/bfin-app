<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>bfin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #1a1a2e; display: flex; align-items: center; justify-content: center; font-family: 'Inter', -apple-system, system-ui, sans-serif; }
  body { min-height: 100vh; }

  /* Phone shell */
  .phone-shell {
    width: 390px; height: 844px;
    border-radius: 48px;
    background: #fff;
    box-shadow: 0 40px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.15), inset 0 0 0 1.5px rgba(255,255,255,0.08);
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  /* Status bar */
  .status-bar {
    height: 54px; flex-shrink: 0;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 28px 10px;
    background: white; position: relative; z-index: 10;
  }
  .status-bar .time { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }
  /* Dynamic island */
  .dynamic-island {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 20;
  }
  /* Home indicator */
  .home-indicator {
    height: 34px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding-bottom: 8px;
    background: white;
  }
  .home-indicator-bar {
    width: 134px; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.2);
  }
  /* Screen area */
  .screen-area {
    flex: 1; overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }

  :root {
    --white: #ffffff;
    --bg: #f7f7f7;
    --bg-section: #f2f2f2;
    --text: #222222;
    --text-muted: #6a6a6a;
    --text-light: #929292;
    --accent: #ff385c;
    --accent-active: #e00b41;
    --accent-disabled: #ffd1da;
    --green: #2db55d;
    --green-light: #e8f7ef;
    --red: #c13515;
    --red-light: #fde8e8;
    --orange: #ff385c;
    --orange-light: #fff0f2;
    --pink: #92174d;
    --purple: #460479;
    --amber: #c17a00;
    --amber-bg: #fef3c7;
    --navy: #1a1a3e;
    --border: #dddddd;
    --border-soft: #ebebeb;
    --saldo-green: #bbf7d0;
    --saldo-amber: #fde68a;
    --saldo-red: #fecaca;
    --saldo-zero: #fef3c7;
    --shadow-card: rgba(0,0,0,0.02) 0 0 0 1px, rgba(0,0,0,0.04) 0 2px 6px, rgba(0,0,0,0.1) 0 4px 8px;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-pill: 9999px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 0; }

  .app-screen {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--white);
    overflow: hidden;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
  }

  /* Header */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header-month {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-arrow {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 18px; padding: 2px 6px;
    border-radius: 4px;
  }
  .header-arrow:hover { background: var(--bg); }
  .cal-icon {
    width: 36px; height: 36px;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; gap: 1px;
  }
  .cal-top { width: 22px; height: 7px; background: var(--accent); border-radius: 2px 2px 0 0; display: flex; align-items: center; justify-content: center; }
  .cal-top span { font-size: 5px; font-weight: 700; color: white; }
  .cal-num { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1; }
  .grid-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 6px;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px;
    padding: 5px; cursor: pointer;
  }
  .grid-icon span { background: white; border-radius: 1px; }

  /* Scrollable content */
  .app-content {
    flex: 1;
    overflow-y: auto;
    background: var(--white);
  }

  /* Bottom Nav */
  .bottom-nav {
    display: flex; align-items: center; justify-content: space-around;
    padding: 6px 8px 20px;
    background: var(--white);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; padding: 4px 10px; border-radius: 8px;
    font-size: 10px; font-weight: 500; color: var(--text-muted);
    background: none; border: none; font-family: 'Inter', -apple-system, system-ui, sans-serif;
    transition: color 0.15s;
  }
  .nav-item.active { color: var(--accent); font-weight: 600; }
  .nav-item svg { width: 20px; height: 20px; }
  .nav-item.active svg { stroke: var(--accent); }
  .nav-fab {
    width: 52px; height: 52px;
    background: var(--accent); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: none; color: white; font-size: 28px;
    margin-top: -12px;
    box-shadow: var(--shadow-card);
    transition: transform 0.15s, background 0.15s;
  }
  .nav-fab:hover { transform: scale(1.05); background: var(--accent-active); }

  /* Section label */
  .section-label {
    font-size: 12px; color: var(--text-muted);
    padding: 14px 16px 6px;
    font-weight: 500; letter-spacing: 0.02em;
  }

  /* Divider */
  .divider { height: 1px; background: var(--border); margin: 0; }

  /* Metric row */
  .metric-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 16px 16px;
  }
  .metric-left { display: flex; flex-direction: column; gap: 6px; }
  .metric-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .metric-tags { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .tag-badge {
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700; color: white; flex-shrink: 0;
  }
  .tag-sep { font-size: 10px; color: var(--text-light); font-weight: 700; }
  .metric-right { text-align: right; }
  .metric-value { font-size: 15px; font-weight: 600; color: var(--text); }
  .metric-value.negative { color: var(--accent); }
  .metric-value.positive { color: var(--green); }
  .metric-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .metric-sub.negative { color: var(--accent); }

  /* Progress bar */
  .progress-bar-track {
    width: 100px; height: 10px;
    background: var(--bg-section); border-radius: 5px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: var(--green); border-radius: 5px;
    transition: width 0.3s;
  }
  .saving-row {
    display: flex; align-items: center; gap: 6px;
    margin-top: 4px;
  }

  /* Saldos screen */
  .saldos-filter-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px 6px;
  }
  .saldos-col-header {
    display: grid; grid-template-columns: 32px 1fr 1fr;
    gap: 4px; padding: 6px 16px;
    border-bottom: 1px solid var(--border);
  }
  .col-h { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .col-h.right { text-align: right; }

  .day-group { border-bottom: 1px solid var(--border); }
  .day-row-main {
    display: grid; grid-template-columns: 32px 1fr 80px;
    gap: 4px; align-items: center; padding: 8px 16px 4px;
  }
  .day-num { font-size: 13px; font-weight: 700; color: var(--text); }
  .day-saldo-cell {
    text-align: right; font-size: 13px; font-weight: 600;
    padding: 4px 8px; border-radius: 6px;
  }
  .day-saldo-cell.green { background: var(--saldo-green); color: #166534; }
  .day-saldo-cell.amber { background: var(--saldo-amber); color: #92400e; }
  .day-saldo-cell.zero { background: var(--saldo-zero); color: #92400e; }
  .day-saldo-cell.red { background: var(--saldo-red); color: #991b1b; }

  .day-transaction-row {
    display: grid; grid-template-columns: 32px 1fr 80px;
    gap: 4px; align-items: center; padding: 3px 16px;
  }
  .tx-dot { display: flex; align-items: center; justify-content: center; }
  .tx-amount { font-size: 12px; color: var(--text-muted); }
  .tx-amount.right { text-align: right; }

  /* Filter pill */
  .filter-pill {
    display: flex; align-items: center; gap: 6px;
    background: white; border-radius: var(--radius-pill);
    padding: 6px 12px; font-size: 12px; font-weight: 500;
    color: var(--text); cursor: pointer; border: 1px solid var(--border);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    box-shadow: var(--shadow-card);
  }

  /* Horizonte de saldos */
  .horizonte-table { width: 100%; }
  .horizonte-header-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    border-bottom: 1px solid var(--border);
  }
  .horizonte-month-col {
    display: flex; flex-direction: column;
  }
  .horizonte-month-header {
    font-size: 12px; font-weight: 700; color: var(--text);
    padding: 10px 8px; text-align: center;
    border-right: 1px solid var(--border);
  }
  .horizonte-month-header.current { background: var(--text); color: white; }
  .horizonte-cell {
    display: grid; grid-template-columns: 24px 1fr;
    gap: 4px; align-items: center;
    padding: 6px 6px;
    border-bottom: 1px solid #f0f0f0;
    border-right: 1px solid var(--border);
    font-size: 11px;
  }
  .horizonte-cell .day { font-weight: 600; color: var(--text); }
  .horizonte-cell .val { text-align: right; font-weight: 500; }
  .horizonte-cell.today { background: var(--text); }
  .horizonte-cell.today .day,
  .horizonte-cell.today .val { color: white; }
  .horizonte-cell.green-bg { background: #bbf7d0; }
  .horizonte-cell.amber-bg { background: var(--saldo-amber); }
  .horizonte-cell.red-bg { background: var(--saldo-red); }
  .horizonte-cell.zero-bg { background: var(--saldo-zero); }
  .horizonte-table-body {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
  }

  /* Previsão de diário */
  .preview-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; border-bottom: 1px solid var(--border);
  }
  .preview-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .preview-val { font-size: 15px; font-weight: 500; color: var(--text); }
  .preview-footer {
    padding: 16px; background: var(--white);
  }
  .preview-footer-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 0; font-size: 14px; color: var(--text);
  }
  .preview-footer-row.bold { font-weight: 700; font-size: 18px; margin-top: 8px; }
  .days-select {
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 4px 8px; font-size: 13px; font-family: 'Inter', -apple-system, system-ui, sans-serif;
    background: white; cursor: pointer; color: var(--text);
  }

  /* Add modal */
  .modal-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex; align-items: flex-end;
    z-index: 100;
  }
  .modal-sheet {
    width: 100%; background: white;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    display: flex; flex-direction: column; gap: 0;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .modal-amount {
    font-size: 32px; font-weight: 700; color: var(--text);
    display: flex; align-items: baseline; gap: 6px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .modal-amount span.placeholder { color: var(--text-light); }
  .modal-close {
    margin-left: auto; background: none; border: none;
    font-size: 22px; color: var(--text-muted); cursor: pointer;
    padding: 0 4px;
  }
  .modal-desc-row {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 0; border-bottom: 1px solid var(--border);
  }
  .modal-desc-input {
    flex: 1; border: none; outline: none;
    font-size: 15px; font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: var(--text); background: transparent;
  }
  .modal-desc-input::placeholder { color: var(--text-muted); }

  /* Type selector */
  .type-selector {
    display: flex; gap: 8px; padding: 16px 0;
  }
  .type-btn {
    flex: 1; padding: 10px 6px; border-radius: 10px;
    border: 2px solid var(--border); background: white;
    font-size: 12px; font-weight: 600; cursor: pointer;
    font-family: 'Inter', -apple-system, system-ui, sans-serif; color: var(--text-muted);
    transition: all 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .type-btn.active-entrada { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .type-btn.active-saida { border-color: var(--accent); background: var(--orange-light); color: var(--accent); }
  .type-btn.active-diario { border-color: var(--pink); background: #fdf2f8; color: var(--pink); }
  .type-btn.active-economia { border-color: var(--green); background: var(--green-light); color: var(--green); }

  /* Numpad */
  .numpad {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; margin-top: 8px;
  }
  .numpad-key {
    padding: 14px; border-radius: var(--radius-sm);
    background: var(--bg); border: none;
    font-size: 18px; font-weight: 500; cursor: pointer;
    font-family: 'Inter', -apple-system, system-ui, sans-serif; color: var(--text);
    transition: background 0.1s;
  }
  .numpad-key:active { background: #ddd; }
  .numpad-key.action { background: var(--accent); color: white; font-size: 14px; border-radius: var(--radius-sm); }

  .modal-submit-btn {
    margin-top: 16px; width: 100%;
    padding: 16px; border-radius: var(--radius-pill);
    background: var(--accent); color: white;
    border: none; font-size: 16px; font-weight: 500;
    cursor: pointer; font-family: 'Inter', -apple-system, system-ui, sans-serif;
    transition: background 0.15s;
  }
  .modal-submit-btn:hover { background: var(--accent-active); }

  /* Login screen */
  .login-screen {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #ffffff; padding: 32px 28px;
    gap: 0;
  }
  .login-logo {
    font-size: 48px; font-weight: 800; color: var(--accent);
    letter-spacing: -2px; margin-bottom: 4px;
  }
  .login-logo span { color: var(--accent); }
  .login-tagline { font-size: 14px; color: var(--text-muted); margin-bottom: 0; text-align: center; font-weight: 400; }

  .login-footer { margin-top: 20px; font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.6; }
  .login-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }

  .social-btn {
    width: 100%; padding: 14px 16px;
    border-radius: var(--radius-pill); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 15px; font-weight: 500; cursor: pointer;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    transition: all 0.15s; background: white; color: var(--text);
  }
  .social-btn:hover { background: var(--bg); border-color: #c1c1c1; }
  .social-btn:disabled { opacity: 0.7; cursor: not-allowed; }
  .google-btn { border-color: var(--border); }

  .login-link-btn {
    margin-top: 0; background: none;
    border: 1.5px solid var(--accent);
    border-radius: var(--radius-pill);
    font-size: 15px; font-weight: 500; color: var(--accent);
    cursor: pointer; font-family: 'Inter', -apple-system, system-ui, sans-serif;
    padding: 14px 16px; width: 100%;
    text-decoration: none; transition: background 0.15s;
  }
  .login-link-btn:hover { background: var(--orange-light); }

  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #e0e0e0; border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Back header */
  .back-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .back-btn {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg); border: none; cursor: pointer; border-radius: var(--radius-sm);
    font-size: 20px; color: var(--text); padding: 6px 10px;
  }
  .back-title { font-size: 17px; font-weight: 700; color: var(--text); }
  .icon-btn {
    background: none; border: none; cursor: pointer;
    font-size: 20px; color: var(--text-muted); padding: 2px 6px;
  }

  /* Menu screen */
  .menu-profile { padding: 24px 16px 20px; border-bottom: 1px solid var(--border); }
  .menu-name { font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
  .menu-email { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
  .badge-assinatura {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--green-light); color: var(--green);
    border-radius: var(--radius-pill); padding: 6px 12px;
    font-size: 12px; font-weight: 600;
  }
  .menu-list { display: flex; flex-direction: column; }
  .menu-list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; background: none; border-left: none; border-right: none; border-top: none;
    font-family: 'Inter', -apple-system, system-ui, sans-serif; width: 100%;
    transition: background 0.1s;
  }
  .menu-list-item:hover { background: var(--bg); }
  .menu-item-label { font-size: 15px; color: var(--text); font-weight: 500; flex: 1; text-align: left; }
  .menu-item-arrow { color: var(--text-muted); font-size: 14px; }

  /* Movimentações */
  .mov-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.1s;
  }
  .mov-item:hover { background: var(--bg); }
  .mov-item:active { background: #ebebeb; }
  .mov-item-left { display: flex; align-items: center; gap: 10px; }
  .mov-icon-circle {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: white; flex-shrink: 0;
  }
  .mov-label { font-size: 14px; font-weight: 600; color: var(--text); }
  .mov-value { font-size: 14px; font-weight: 500; color: var(--text); }

  /* Toast */
  .toast {
    position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: white;
    padding: 12px 20px; border-radius: 10px;
    font-size: 13px; font-weight: 500;
    white-space: nowrap;
    animation: fadeInOut 2.5s ease forwards;
    z-index: 200;
  }
  @keyframes fadeInOut {
    0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
    15% { opacity: 1; transform: translateX(-50%) translateY(0); }
    75% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── Data ───────────────────────────────────────────────────────────────────

const MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

const MONTH_DATA = {

  return 'R$ ' + Math.abs(val).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function fmtK(val) {
  if (Math.abs(val) >= 1000) return (val/1000).toFixed(2).replace('.',',') + 'K';

}

            </div>
            {REP_OPTIONS.map(opt => (
              <button key={opt} onClick={() => { setRepetir(opt === 'Não repetir' ? 'Não repetir' : `Repete ${opt.toLowerCase()}`); setRepOpen(false); }} style={{
                display:'block',width:'100%',padding:'18px 20px',
                background:'white',border:'none',borderBottom:'1px solid var(--border)',
                cursor:'pointer',fontFamily:'Inter,-apple-system,system-ui,sans-serif',

      {/* Até quando sub-sheet */}
      {ateOpen && (
        <div style={{position:'absolute',inset:0,zIndex:110,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
          <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.18)'}} onClick={() => setAteOpen(false)} />
          <div style={{position:'relative',background:'white',borderRadius:'20px 20px 0 0',padding:'20px 0 40px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 20px 16px',borderBottom:'1px solid var(--border)'}}>
              <span style={{fontSize:20,fontWeight:700,color:'var(--text)'}}>Até quando</span>
              <button onClick={() => setAteOpen(false)} style={{background:'none',border:'none',fontSize:22,color:'var(--text-muted)',cursor:'pointer'}}>×</button>
            </div>
            {['A perder de vista','Definir número de vezes'].map(opt => (
              <button key={opt} onClick={() => { setAteQuando(opt); setAteOpen(false); }} style={{
                display:'block',width:'100%',padding:'18px 20px',
                background:'white',border:'none',borderBottom:'1px solid var(--border)',
                cursor:'pointer',fontFamily:'Inter,-apple-system,system-ui,sans-serif',
                fontSize:16,fontWeight:500,color:'var(--text)',textAlign:'left',
              }}>
                {opt}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

  '1-cartao':  [{ id:2, desc:'Fatura cartão', valor:1392.46, tipo:'Cartão', date:'01/05' }],
  '2-saida':   [{ id:3, desc:'Encargo de Obra', valor:600.00, tipo:'Saída', date:'02/05' }],
  '2-diario':  [{ id:4, desc:'Gasto diário', valor:86.67, tipo:'Diário', date:'02/05' }],
  '3-diario':  [{ id:5, desc:'Gasto diário', valor:86.67, tipo:'Diário', date:'03/05' }],
  '4-saida':   [{ id:6, desc:'Barbeiro', valor:120.00, tipo:'Saída', date:'04/05' }, { id:7, desc:'Energia', valor:200.00, tipo:'Saída', date:'04/05' }],
  '4-diario':  [{ id:8, desc:'Gasto diário', valor:86.67, tipo:'Diário', date:'04/05' }],

  '5-saida':   [{ id:10, desc:'Supermercado', valor:150.00, tipo:'Saída', date:'05/05' }],
};

function DayDetailScreen({ day, type: initialType, month, onBack, onAdd }) {
  const [filterType, setFilterType] = useState(initialType);
  const [filterOpen, setFilterOpen] = useState(false);
  const [currentDay, setCurrentDay] = useState(day);

  const DAYS_IN_MONTH = 31;

  // Get all transactions for current day + filter
  const txKey = `${currentDay}-${filterType}`;
  const allTypes = ['entrada','saida','diario','cartao','economia'];
  
  const txItems = filterType === 'todas'
    ? allTypes.flatMap(t => DAY_TX_DATA[`${currentDay}-${t}`] || [])
    : (DAY_TX_DATA[txKey] || []);

  const filterLabel = filterType === 'todas' ? 'Todas' : (TYPE_LABELS_FULL[filterType] || filterType);
  const filterColor = filterType === 'todas' ? '#888' : CAT_COLORS[filterType];

  return (
    <div style={{position:'absolute',inset:0,zIndex:200,background:'white',display:'flex',flexDirection:'column',animation:'slideUp 0.22s ease'}}>
      {/* Header */}
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'14px 16px', borderBottom:'1px solid var(--border)', flexShrink:0,
      }}>
        <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',fontSize:20,color:'var(--text)',padding:'2px 6px'}}>←</button>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <button onClick={() => setCurrentDay(d => Math.max(1,d-1))}
            style={{background:'none',border:'none',cursor:'pointer',fontSize:16,color:'var(--text-muted)',padding:'2px 6px'}}>‹</button>
          <span style={{fontSize:18,fontWeight:700,color:'var(--text)',minWidth:70,textAlign:'center'}}>
            {String(currentDay).padStart(2,'0')}/05
          </span>
          <button onClick={() => setCurrentDay(d => Math.min(DAYS_IN_MONTH,d+1))}
            style={{background:'none',border:'none',cursor:'pointer',fontSize:16,color:'var(--text-muted)',padding:'2px 6px'}}>›</button>
        </div>
        <button onClick={onAdd} style={{background:'none',border:'none',cursor:'pointer',fontSize:22,color:'var(--text)',padding:'2px 4px',lineHeight:1}}>+</button>
      </div>

      {/* Filter dropdown */}
      <div style={{padding:'10px 16px', borderBottom:'1px solid var(--border)', flexShrink:0, position:'relative'}}>
        <button onClick={() => setFilterOpen(o=>!o)} style={{
          display:'flex',alignItems:'center',gap:8,
          background:'var(--bg-section)',border:'1px solid var(--border)',
          borderRadius:50,padding:'8px 14px',cursor:'pointer',
          fontFamily:'Inter,-apple-system,system-ui,sans-serif',width:'100%',
        }}>
          {filterType !== 'todas' && (
            <div style={{width:22,height:22,borderRadius:'50%',background:filterColor,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <span style={{fontSize:8,fontWeight:800,color:'white'}}>{CAT_LABELS[filterType]}</span>
            </div>
          )}
          <span style={{fontSize:14,fontWeight:600,color:'var(--text)',flex:1,textAlign:'left'}}>{filterLabel}</span>
          <span style={{fontSize:12,color:'var(--text-muted)'}}>▾</span>
        </button>
        {filterOpen && (
          <div style={{
            position:'absolute',top:'calc(100% - 4px)',left:16,right:16,zIndex:10,
            background:'white',borderRadius:14,boxShadow:'0 4px 24px rgba(0,0,0,0.14)',
            border:'1px solid var(--border)',overflow:'hidden',
          }}>
            {[{id:'todas',label:'Todas'},...Object.entries(TYPE_LABELS_FULL).map(([id,label])=>({id,label}))].map(opt => (
              <button key={opt.id} onClick={() => {setFilterType(opt.id);setFilterOpen(false);}} style={{
                display:'flex',alignItems:'center',gap:10,
                width:'100%',padding:'12px 16px',
                background: filterType===opt.id ? 'var(--bg-section)' : 'white',
                border:'none',borderBottom:'1px solid var(--border)',
                cursor:'pointer',fontFamily:'Inter,-apple-system,system-ui,sans-serif',
                fontSize:14,fontWeight:500,color:'var(--text)',textAlign:'left',
              }}>
                {opt.id !== 'todas' && (
                  <div style={{width:22,height:22,borderRadius:'50%',background:CAT_COLORS[opt.id],display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <span style={{fontSize:8,fontWeight:800,color:'white'}}>{CAT_LABELS[opt.id]}</span>
                  </div>
                )}
                {opt.label}
                {filterType===opt.id && <span style={{marginLeft:'auto',color:'var(--accent)'}}>✓</span>}
              </button>
            ))}
          </div>
        )}
      </div>

      {/* Transactions list */}
      <div style={{flex:1,overflowY:'auto'}}>
        {txItems.length === 0 ? (
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',gap:12,color:'var(--text-muted)',padding:32}}>
            <div style={{width:48,height:48,borderRadius:'50%',background:'var(--bg-section)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <line x1="10" y1="4" x2="10" y2="16" stroke="#bbb" strokeWidth="1.8" strokeLinecap="round"/>
                <line x1="4" y1="10" x2="16" y2="10" stroke="#bbb" strokeWidth="1.8" strokeLinecap="round"/>
              </svg>
            </div>
            <span style={{fontSize:13,textAlign:'center'}}>Nenhum lançamento neste dia.<br/>Toque em + para adicionar.</span>
          </div>
        ) : (
          txItems.map(tx => {
            // find which type this tx belongs to
            const txType = allTypes.find(t => (DAY_TX_DATA[`${currentDay}-${t}`] || []).some(i => i.id === tx.id)) || 'saida';
            const txColor = CAT_COLORS[txType];
            return (
            <div key={tx.id} style={{
              display:'flex',alignItems:'center',gap:12,
              padding:'16px',borderBottom:'1px solid var(--border)',
              cursor:'pointer',
            }}>
              <div style={{
                width:34,height:34,borderRadius:'50%',flexShrink:0,
                background: txColor,
                display:'flex',alignItems:'center',justifyContent:'center',
              }}>
                <span style={{fontSize:11,fontWeight:800,color:'white'}}>{CAT_LABELS[txType]}</span>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:15,fontWeight:700,color:'var(--text)'}}>{tx.desc}</div>
                <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{tx.date}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:15,fontWeight:600,color:'var(--text)'}}>{fmt(tx.valor)}</div>
                <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{tx.tipo}</div>
              </div>
            </div>
            );
          })
        )}
      </div>
    </div>
  );
}

// ─── Saldos Screen ────────────────────────────────────────────────────────────
const CAT_TYPES = ['entrada', 'saida', 'diario', 'cartao', 'economia'];
const TODAY_DAY = 4; // May 4, 2026

const FILTER_OPTIONS = [
  { id: 'todas',    label: 'Todas',    types: ['entrada','saida','diario','cartao','economia'] },
  { id: 'entrada',  label: 'Entradas', types: ['entrada'] },
  { id: 'saida',    label: 'Saídas',   types: ['saida'] },
  { id: 'diario',   label: 'Diário',   types: ['diario'] },
  { id: 'cartao',   label: 'Cartão',   types: ['cartao'] },
  { id: 'economia', label: 'Guardado', types: ['economia'] },
];

const SALDO_DAYS = {
  1: { entrada: 9165.48, saida: 0,      diario: 0,     cartao: 1392.46, economia: 0, saldo: 7773.02 },
  2: { entrada: 0,       saida: 600.00, diario: 86.67, cartao: 0,       economia: 0, saldo: 7086.35 },
  3: { entrada: 0,       saida: 0,      diario: 86.67, cartao: 0,       economia: 0, saldo: 6999.68 },
  4: { entrada: 0,       saida: 320.00, diario: 86.67, cartao: 248.42,  economia: 0, saldo: 6344.59 },
  5: { entrada: 0,       saida: 150.00, diario: 0,     cartao: 0,       economia: 0, saldo: 6194.59 },
  6: { entrada: 0,       saida: 0,      diario: 0,     cartao: 0,       economia: 0, saldo: 6194.59 },
};

function SaldosScreen({ month, onHorizonte, onNavigate, onAdd }) {
  const [filterOpen, setFilterOpen] = useState(false);
  const [activeFilter, setActiveFilter] = useState('todas');
  const [addModal, setAddModal] = useState(null); // {day, type}
  const [detailModal, setDetailModal] = useState(null); // {day, type}
  const contentRef = useRef(null);
  const todayRef = useRef(null);

  function scrollToToday() {
    if (todayRef.current && contentRef.current) {
      const container = contentRef.current;
      const el = todayRef.current;
      const containerHeight = container.clientHeight;
      const elTop = el.offsetTop;
      const elHeight = el.offsetHeight;
      container.scrollTo({ top: elTop - (containerHeight / 2) + (elHeight / 2), behavior: 'smooth' });
    }
  }

  const currentFilter = FILTER_OPTIONS.find(f => f.id === activeFilter);
  const visibleTypes = currentFilter.types;

  const days = Array.from({length: 18}, (_, i) => {
    const d = i + 1;
    const data = SALDO_DAYS[d] || { entrada:0, saida:0, diario:0, cartao:0, economia:0, saldo:0 };
    return { day: d, saldo: data.saldo, cats: data };
  });

  function saldoBg(v) {
    if (v > 1000) return '#bbf7d0';
    if (v > 0)    return '#d1fae5';
    if (v === 0)  return '#fef3c7';
    return '#fecaca';
  }
  function saldoColor(v) {
    if (v > 0) return '#166534';
    if (v === 0) return '#92400e';
    return '#991b1b';
  }

  return (
    <div className="app-screen">
      <MonthHeader month={month} onGrid={onHorizonte} onCalendar={scrollToToday} onPrev={()=>{}} onNext={()=>{}} />

      {/* Column headers row — fixed, outside scroll area */}
      <div style={{
        display:'grid', gridTemplateColumns:'36px 1fr 90px',
        padding:'8px 12px 6px', borderBottom:'1px solid var(--border)',
        alignItems:'center', gap:4, position:'relative',
        flexShrink:0, background:'white', zIndex:10,
      }}>
        <span style={{fontSize:11,color:'var(--text-muted)',fontWeight:600}}>Dia</span>

        {/* Filter dropdown trigger */}
        <div style={{position:'relative'}}>
          <button className="filter-pill" onClick={() => setFilterOpen(o => !o)}>
            {activeFilter !== 'todas' && (
              <div style={{
                width:14,height:14,borderRadius:'50%',
                background: CAT_COLORS[activeFilter] || '#888',
                display:'flex',alignItems:'center',justifyContent:'center',
                flexShrink:0,
              }}>
                <span style={{fontSize:7,fontWeight:800,color:'white'}}>{CAT_LABELS[activeFilter] || '⚏'}</span>
              </div>
            )}
            {activeFilter === 'todas' && (
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <circle cx="4" cy="4" r="1.5" fill="currentColor"/>
                <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
                <circle cx="4" cy="8" r="1.5" fill="currentColor" opacity="0.4"/>
                <circle cx="8" cy="4" r="1.5" fill="currentColor" opacity="0.4"/>
              </svg>
            )}
            {currentFilter.label}
            <span style={{fontSize:10}}>▾</span>
          </button>

          {/* Dropdown menu */}
          {filterOpen && (
            <div style={{
              position:'absolute', top:'calc(100% + 4px)', left:0, zIndex:50,
              background:'white', borderRadius:14, boxShadow:'0 4px 24px rgba(0,0,0,0.14)',
              border:'1px solid var(--border)', overflow:'hidden', minWidth:140,
            }}>
              {FILTER_OPTIONS.map(opt => (
                <button key={opt.id} onClick={() => { setActiveFilter(opt.id); setFilterOpen(false); }}
                  style={{
                    display:'flex', alignItems:'center', gap:8,
                    width:'100%', padding:'10px 14px',
                    background: activeFilter === opt.id ? 'var(--bg-section)' : 'white',
                    border:'none', cursor:'pointer', fontFamily:'Inter, -apple-system, system-ui, sans-serif',
                    fontSize:13, fontWeight: activeFilter === opt.id ? 700 : 500,
                    color:'var(--text)', textAlign:'left',
                    borderBottom:'1px solid var(--border)',
                  }}>
                  {opt.id !== 'todas' && (
                    <div style={{
                      width:18,height:18,borderRadius:'50%',
                      background: CAT_COLORS[opt.id],
                      display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
                    }}>
                      <span style={{fontSize:7,fontWeight:800,color:'white'}}>{CAT_LABELS[opt.id]}</span>
                    </div>
                  )}
                  {opt.id === 'todas' && (
                    <div style={{width:18,height:18,borderRadius:'50%',background:'#ddd',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      <span style={{fontSize:7,color:'#888'}}>⚏</span>
                    </div>
                  )}
                  {opt.label}
                  {activeFilter === opt.id && <span style={{marginLeft:'auto',color:'var(--accent)'}}>✓</span>}
                </button>
              ))}
            </div>
          )}
        </div>

        <span style={{fontSize:11,color:'var(--text-muted)',fontWeight:600,textAlign:'right',paddingRight:10}}>Saldos</span>
      </div>

      <div className="app-content" ref={contentRef}>

        {/* Day groups */}
        {days.map((day) => {
          const isToday = day.day === TODAY_DAY;
          return (
            <div key={day.day} ref={isToday ? todayRef : null} style={{
              borderBottom:'1px solid var(--border)',
              display:'grid', gridTemplateColumns:'36px 1fr 90px',
            }}>
              {/* Day number col — black bg for today */}
              <div style={{
                background: isToday ? 'var(--text)' : 'white',
                display:'flex', alignItems:'flex-start',
                paddingTop:8, paddingLeft:10,
              }}>
                <span style={{fontSize:13, fontWeight:700, color: isToday ? 'white' : 'var(--text)'}}>
                  {day.day}
                </span>
              </div>

              {/* Category rows */}
              <div style={{display:'flex', flexDirection:'column', padding:'4px 0'}}>
                {visibleTypes.map((type) => {
                  const amount = day.cats[type] || 0;
                  const hasValue = amount > 0;
                  return (
                    <div key={type} style={{display:'flex', alignItems:'center', gap:7, padding:'4px 0',
                      cursor: hasValue ? 'pointer' : 'default'}}
                      onClick={() => hasValue ? setDetailModal({ day: day.day, type }) : setAddModal({ day: day.day, type })}>
                      <div style={{
                        width:22, height:22, borderRadius:'50%',
                        background: CAT_COLORS[type],
                        display:'flex', alignItems:'center', justifyContent:'center',
                        flexShrink:0, opacity: hasValue ? 1 : 0.18,
                        cursor:'pointer', transition:'opacity 0.15s, transform 0.1s',
                      }}>
                        <span style={{fontSize:8, fontWeight:800, color:'white'}}>{CAT_LABELS[type]}</span>
                      </div>
                      <span style={{fontSize:12, fontWeight:500, color: hasValue ? 'var(--text)' : '#c8c8c8'}}>
                        {hasValue ? fmt(amount) : 'R$ 0,00'}
                      </span>
                    </div>
                  );
                })}
              </div>

              {/* Saldo col */}
              <div style={{
                background: saldoBg(day.saldo),
                display:'flex', alignItems:'flex-start', justifyContent:'flex-end',
                paddingTop:8, paddingRight:10,
              }}>
                <span style={{fontSize:13, fontWeight:600, color: saldoColor(day.saldo)}}>
                  {fmt(day.saldo)}
                </span>
              </div>
            </div>
          );
        })}
        <div style={{height:16}} />
      </div>
      <BottomNav active="saldos" onChange={onNavigate} onAdd={onAdd} />

      {/* Day detail screen */}
      {detailModal && (
        <DayDetailScreen
          day={detailModal.day}
          type={detailModal.type}
          month={month}
          onBack={() => setDetailModal(null)}
          onAdd={() => { setDetailModal(null); setAddModal({ day: detailModal.day, type: detailModal.type }); }}
        />
      )}

      {/* Inline Add Modal */}
      {addModal && (
        <QuickAddModal
          day={addModal.day}
          type={addModal.type}
          month={month}
          onClose={() => setAddModal(null)}
        />
      )}
    </div>
  );
}

// ─── Horizonte de Saldos — full data ─────────────────────────────────────────
const HORIZONTE_MONTHS = [
  { key: 'mar', label: 'Mar/26', days: 31 },
  { key: 'abr', label: 'Abr/26', days: 30 },
  { key: 'mai', label: 'Mai/26', days: 31, current: true },
  { key: 'jun', label: 'Jun/26', days: 30 },
  { key: 'jul', label: 'Jul/26', days: 31 },
];

// Generate saldo data per month/day
function generateHorizonteSaldo(monthKey, day) {
  const base = { mar: 2200, abr: 0, mai: -488, jun: -2350, jul: -3100 };
  const delta = { mar: 180, abr: -150, mai: -120, jun: -80, jul: -60 };
  const b = base[monthKey] || 0;
  const d = delta[monthKey] || 0;
  // today = abr day 9 = black row
  if (monthKey === 'abr' && day === 9) return 14.6;
  if (monthKey === 'abr') {
    if (day < 9) return -(350 - (day - 1) * 40);
    return b + (day - 9) * 35;
  }
  return Math.round(b + (day - 1) * d);
}

function HorizonteScreen({ onBack }) {
  const scrollRef = useRef(null);
  const TODAY_MONTH_IDX = 2; // Mai/26
  const [monthOffset, setMonthOffset] = useState(0);

  // Swipe horizontal state
  const swipeStartX = useRef(null);
  const swipeStartY = useRef(null);
  const swipeLocked = useRef(null); // 'h' | 'v' | null

  function onTouchStart(e) {
    swipeStartX.current = e.touches[0].clientX;
    swipeStartY.current = e.touches[0].clientY;
    swipeLocked.current = null;
  }
  function onTouchMove(e) {
    if (!swipeStartX.current) return;
    const dx = e.touches[0].clientX - swipeStartX.current;
    const dy = e.touches[0].clientY - swipeStartY.current;
    if (!swipeLocked.current) {
      swipeLocked.current = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
    if (swipeLocked.current === 'h') {
      e.preventDefault(); // prevent vertical scroll when swiping horizontally
    }
  }
  function onTouchEnd(e) {
    if (swipeLocked.current !== 'h' || !swipeStartX.current) return;
    const dx = e.changedTouches[0].clientX - swipeStartX.current;
    if (dx < -50 && monthOffset + 3 < HORIZONTE_MONTHS.length) {
      setMonthOffset(o => o + 1);
    } else if (dx > 50 && monthOffset > 0) {
      setMonthOffset(o => o - 1);
    }
    swipeStartX.current = null;
    swipeLocked.current = null;
  }

  // Mouse swipe support for desktop
  const mouseDown = useRef(false);
  const mouseStartX = useRef(null);
  function onMouseDown(e) { mouseDown.current = true; mouseStartX.current = e.clientX; }
  function onMouseUp(e) {
    if (!mouseDown.current) return;
    mouseDown.current = false;
    const dx = e.clientX - mouseStartX.current;
    if (dx < -60 && monthOffset + 3 < HORIZONTE_MONTHS.length) setMonthOffset(o => o + 1);
    else if (dx > 60 && monthOffset > 0) setMonthOffset(o => o - 1);
  }

  // Visible 3 months
  const visibleMonths = HORIZONTE_MONTHS.slice(monthOffset, monthOffset + 3);
  const maxDays = Math.max(...visibleMonths.map(m => m.days));

  function cellBg(val, isToday) {
    if (isToday) return '#1a1a1a';
    if (val === null) return 'white';
    if (val > 1000)  return '#fef3c7'; // amber-light for positive
    if (val > 0)     return '#fde68a'; // amber for small positive
    if (val === 0)   return '#fff3cd';
    if (val > -500)  return '#fecaca'; // light red
    if (val > -2000) return '#f87171'; // mid red
    return '#ef4444'; // deep red
  }
  function cellColor(val, isToday) {
    if (isToday) return 'white';
    if (val === null) return 'var(--text-muted)';
    if (val > 0)  return '#92400e';
    if (val === 0) return '#92400e';
    return 'white';
  }
  function fmtH(val) {
    if (val === null) return '';
    if (val === 0) return '0';
    const abs = Math.abs(val);
    const sign = val < 0 ? '-' : '';
    if (abs >= 1000) return sign + (abs/1000).toFixed(abs >= 10000 ? 1 : 2).replace('.',',') + 'K';
    return sign + abs.toLocaleString('pt-BR');
  }

  // Scroll to today on mount
  useEffect(() => {
    if (scrollRef.current) {
      const ROW_H = 36;
      scrollRef.current.scrollTop = (TODAY_DAY - 1) * ROW_H - 100;
    }
  }, []);

  const canPrev = monthOffset > 0;
  const canNext = monthOffset + 3 < HORIZONTE_MONTHS.length;

  return (
    <div className="app-screen"
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
      onMouseDown={onMouseDown}
      onMouseUp={onMouseUp}
      style={{userSelect:'none', touchAction:'pan-y'}}
    >
      {/* Header */}
      <div className="back-header">
        <button className="back-btn" onClick={onBack}>←</button>
        <span className="back-title">Horizonte de saldos</span>
        <button className="icon-btn">+</button>
      </div>

      {/* Month headers — fixed */}
      <div style={{
        display:'grid', gridTemplateColumns:'1fr 1fr 1fr',
        borderBottom:'1px solid var(--border)', flexShrink:0,
        background:'white',
      }}>
        {visibleMonths.map((m, idx) => {
          const isCurrentMonth = m.current;
          return (
            <div key={m.key} style={{
              padding:'10px 6px', textAlign:'center',
              fontSize:13, fontWeight:700,
              background: isCurrentMonth ? 'var(--text)' : 'white',
              color: isCurrentMonth ? 'white' : 'var(--text)',
              borderRight: idx < 2 ? '1px solid var(--border)' : 'none',
              display:'flex', alignItems:'center', justifyContent:'center', gap:4,
            }}>
              {idx === 0 && canPrev && (
                <button onClick={() => setMonthOffset(o => o-1)} style={{background:'none',border:'none',cursor:'pointer',color:'inherit',fontSize:14,padding:'0 2px',opacity:0.7}}>‹</button>
              )}
              {m.label}
              {idx === 2 && canNext && (
                <button onClick={() => setMonthOffset(o => o+1)} style={{background:'none',border:'none',cursor:'pointer',color:'inherit',fontSize:14,padding:'0 2px',opacity:0.7}}>›</button>
              )}
            </div>
          );
        })}
      </div>

      {/* Scrollable rows */}
      <div ref={scrollRef} className="app-content" key={monthOffset}
        style={{animation:'fadeIn 0.18s ease'}}>
        {Array.from({length: maxDays}, (_, i) => {
          const day = i + 1;
          const isToday = visibleMonths.some(m => m.current) && day === TODAY_DAY;
          return (
            <div key={day} style={{
              display:'grid', gridTemplateColumns:'1fr 1fr 1fr',
              borderBottom:'1px solid rgba(0,0,0,0.05)',
            }}>
              {visibleMonths.map((m, ci) => {
                const val = day <= m.days ? generateHorizonteSaldo(m.key, day) : null;
                const todayCell = m.current && day === TODAY_DAY;
                const bg = cellBg(val, todayCell);
                const fg = cellColor(val, todayCell);
                return (
                  <div key={m.key} style={{
                    display:'flex',
                    alignItems:'stretch',
                    borderRight: ci < 2 ? '1px solid rgba(0,0,0,0.08)' : 'none',
                    minHeight:36,
                  }}>
                    {/* Day number — always neutral bg */}
                    <div style={{
                      width:22, flexShrink:0,
                      display:'flex', alignItems:'center', justifyContent:'center',
                      background: todayCell ? '#1a1a1a' : 'white',
                      borderRight:'1px solid rgba(0,0,0,0.07)',
                    }}>
                      <span style={{
                        fontSize:11, fontWeight:700, lineHeight:1,
                        color: todayCell ? 'white' : 'var(--text-muted)',
                      }}>{day <= m.days ? day : ''}</span>
                    </div>
                    {/* Value — colored bg */}
                    <div style={{
                      flex:1, display:'flex', alignItems:'center', justifyContent:'flex-end',
                      padding:'0 6px',
                      background: bg,
                    }}>
                      <span style={{
                        fontSize:12, fontWeight:600,
                        color: fg, lineHeight:1,
                      }}>{fmtH(val)}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}
        <div style={{height:20}} />
      </div>
    </div>
  );
}

function SwipeableItem({ item, onEdit, onDelete }) {
  const [offsetX, setOffsetX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startX = useRef(null);
  const DELETE_THRESHOLD = 80;

  function onTouchStart(e) {
    startX.current = e.touches[0].clientX;
    setDragging(true);
  }
  function onTouchMove(e) {
    if (startX.current === null) return;
    const dx = e.touches[0].clientX - startX.current;
    if (dx < 0) setOffsetX(Math.max(dx, -DELETE_THRESHOLD - 20));
  }
  function onTouchEnd() {
    setDragging(false);
    if (offsetX < -(DELETE_THRESHOLD * 0.6)) {
      setOffsetX(-DELETE_THRESHOLD);
    } else {
      setOffsetX(0);
    }
    startX.current = null;
  }

  // Mouse support for desktop prototype
  const mouseDown = useRef(false);
  function onMouseDown(e) {
    mouseDown.current = true;
    startX.current = e.clientX;
    setDragging(true);
  }
  function onMouseMove(e) {
    if (!mouseDown.current || startX.current === null) return;
    const dx = e.clientX - startX.current;
    if (dx < 0) setOffsetX(Math.max(dx, -DELETE_THRESHOLD - 20));
  }
  function onMouseUp() {
    mouseDown.current = false;
    setDragging(false);
    if (offsetX < -(DELETE_THRESHOLD * 0.6)) {
      setOffsetX(-DELETE_THRESHOLD);
    } else {
      setOffsetX(0);
    }
    startX.current = null;
  }

  const revealed = offsetX <= -(DELETE_THRESHOLD * 0.6);

  return (
    <div style={{position:'relative', overflow:'hidden', borderBottom:'1px solid var(--border)'}}>
      {/* Delete background */}
      <div style={{
        position:'absolute', right:0, top:0, bottom:0,
        width:DELETE_THRESHOLD + 20,
        background:'var(--red)',
        display:'flex', alignItems:'center', justifyContent:'center',
      }}>
        <button onClick={onDelete} style={{
          background:'none', border:'none', cursor:'pointer',
          display:'flex', flexDirection:'column', alignItems:'center', gap:3,
          color:'white', fontFamily:'Inter,-apple-system,system-ui,sans-serif',
        }}>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M3 5h14M8 5V3h4v2M6 5l1 11h6l1-11" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <span style={{fontSize:10, fontWeight:600}}>Excluir</span>
        </button>
      </div>
      {/* Item */}
      <div
        className="preview-item"
        style={{
          cursor:'pointer',
          transform:`translateX(${offsetX}px)`,
          transition: dragging ? 'none' : 'transform 0.2s ease',
          background:'white', borderBottom:'none',
          userSelect:'none',
        }}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onMouseDown={onMouseDown}
        onMouseMove={onMouseMove}
        onMouseUp={onMouseUp}
        onMouseLeave={onMouseUp}
        onClick={() => { if (offsetX === 0) onEdit(); }}
      >
        <span className="preview-name">{item.name}</span>
        <div style={{display:'flex', alignItems:'center', gap:8}}>
          <span className="preview-val">{fmt(item.val)}</span>
          {revealed && <span style={{fontSize:11, color:'var(--red)'}}>←</span>}
        </div>
      </div>
    </div>
  );
}

function PrevisaoScreen({ onBack }) {
  const [items, setItems] = useState(PREVISAO_DEFAULT);
  const [showAdd, setShowAdd] = useState(false);
  const [editingId, setEditingId] = useState(null); // id of item being edited, or null for new
  const [newName, setNewName] = useState('');
  const [newVal, setNewVal] = useState('');
  const [toast, setToast] = useState(false);
  const [days, setDays] = useState(30);

  const total = items.reduce((a, b) => a + b.val, 0);
  const diario = (total / days).toFixed(2).replace('.', ',');

  function openAdd() {
    setEditingId(null);
    setNewName('');
    setNewVal('');
    setShowAdd(true);
  }

  function openEdit(item) {
    setEditingId(item.id);
    setNewName(item.name);
    setNewVal(item.val.toFixed(2).replace('.', ','));
    setShowAdd(true);
  }

  function closeAdd() {
    setShowAdd(false);
    setEditingId(null);
    setNewName('');
    setNewVal('');
  }

  function deleteItem(id) {
    setItems(prev => prev.filter(it => it.id !== id));
  }

  function addItem() {
    if (!newName || !newVal) return;
    const parsedVal = parseFloat(newVal.replace(',', '.'));
    if (editingId !== null) {
      setItems(prev => prev.map(it => it.id === editingId ? { ...it, name: newName, val: parsedVal } : it));
    } else {
      setItems(prev => [...prev, { id: Date.now(), name: newName, val: parsedVal }]);
    }
    closeAdd();
    setToast(true);
    setTimeout(() => setToast(false), 2500);
  }

  return (
    <div className="app-screen" style={{position:'relative'}}>
      <div className="back-header">
        <button className="back-btn" onClick={onBack}>←</button>
        <span className="back-title">Previsão de diário</span>

function AddModal({ onClose, onSave }) {
  const [amount, setAmount] = useState('');
  const [desc, setDesc] = useState('');
  const [type, setType] = useState('saida');

  const types = [
    { id: 'entrada', label: 'Entrada', color: 'active-entrada' },
    { id: 'saida',   label: 'Saída',   color: 'active-saida' },
    { id: 'diario',  label: 'Diário',  color: 'active-diario' },
    { id: 'economia',label: 'Economia',color: 'active-economia' },
  ];

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-sheet" onClick={e => e.stopPropagation()}>
        <div className="modal-amount">
          <span>R$</span>
          <span className={amount ? '' : 'placeholder'}>{amount || '0,00'}</span>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-desc-row">
          <span style={{color:'var(--text-muted)',fontSize:16}}>✏</span>
          <input className="modal-desc-input" placeholder="Descrição"
            value={desc} onChange={e => setDesc(e.target.value)} />
        </div>
        <div className="type-selector">
          {types.map(t => (
            <button key={t.id}
              className={`type-btn${type === t.id ? ' ' + t.color : ''}`}
              onClick={() => setType(t.id)}>
              <TagBadge type={t.id} size={18} />
              {t.label}
            </button>
          ))}
        </div>
        <div className="numpad">
          {['1','2','3','4','5','6','7','8','9','.',  '0','⌫'].map(k => (
            <button key={k} className={`numpad-key${k==='⌫'?' action':''}`}
              onClick={() => {
                if (k === '⌫') setAmount(v => v.slice(0,-1));
                else setAmount(v => v + k);
              }}>
              {k}
            </button>
          ))}
        </div>
        <button className="modal-submit-btn"
          onClick={() => { onSave({ amount, desc, type }); onClose(); }}>
          Adicionar {types.find(t => t.id === type)?.label}
        </button>
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [loggedIn, setLoggedIn] = useState(false);
  const [screen, setScreen] = useState('totais');
  const [subscreen, setSubscreen] = useState(null); // 'horizonte' | 'previsao' | {tipo:'detalhes', cat:'saida'}
  const [showAdd, setShowAdd] = useState(false);

  const monthKeys = Object.keys(MONTH_DATA);
  const [monthIdx, setMonthIdx] = useState(0);
  const month = monthKeys[monthIdx];
  const data = MONTH_DATA[month];

  function prevMonth() { setMonthIdx(i => Math.max(0, i-1)); }
  function nextMonth() { setMonthIdx(i => Math.min(monthKeys.length-1, i+1)); }

  function navigate(tab) {
    setScreen(tab);
    setSubscreen(null);
  }

  if (!loggedIn) {
    return (
      <PhoneShell>
        <LoginScreen onLogin={() => setLoggedIn(true)} />
      </PhoneShell>
    );
  }

  if (subscreen === 'horizonte') {
    return (
      <PhoneShell>
        <HorizonteScreen onBack={() => setSubscreen(null)} />
      </PhoneShell>
    );
  }

  if (subscreen === 'previsao') {
    return (
      <PhoneShell>
        <PrevisaoScreen onBack={() => setSubscreen(null)} />
      </PhoneShell>
    );
  }

  if (subscreen && subscreen.tipo === 'detalhes') {
    return (
      <PhoneShell>
        <DetalhesScreen
          tipo={subscreen.cat}
          month={month}
          onBack={() => setSubscreen(null)}
          onPrev={prevMonth}
          onNext={nextMonth}
        />
      </PhoneShell>
    );
  }

  return (
    <PhoneShell>
      <div style={{width:'100%',height:'100%',position:'relative',display:'flex',flexDirection:'column'}}>
        {screen === 'saldos' && (
          <SaldosScreen month={month}
            onHorizonte={() => setSubscreen('horizonte')}
            onNavigate={navigate}
            onAdd={() => setShowAdd(true)} />
        )}
        {screen === 'totais' && (
          <TotaisScreen month={month} data={data}
            onPrev={prevMonth} onNext={nextMonth}
            onAdd={() => setShowAdd(true)}
            onNavigate={navigate}
            onHorizonte={() => setSubscreen('horizonte')}
            onDetalhes={(cat) => setSubscreen({ tipo: 'detalhes', cat })} />
        )}
        {screen === 'tags' && (
          <div className="app-screen">
            <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'var(--text-muted)',gap:8,padding:32}}>
              <div style={{fontSize:32}}>🏷</div>
              <div style={{fontSize:16,fontWeight:600,color:'var(--text)'}}>Tags</div>
              <div style={{fontSize:13,textAlign:'center',color:'var(--text-muted)'}}>Organize suas movimentações por tags personalizadas</div>
            </div>
            <BottomNav active="tags" onChange={navigate} onAdd={() => setShowAdd(true)} />
          </div>
        )}
        {screen === 'menu' && (
          <MenuScreen onNavigate={navigate} onPrevisao={() => setSubscreen('previsao')} />
        )}
        {showAdd && (
          <QuickAddModal
            day={TODAY_DAY}
            type="saida"
            month={month}
            onClose={() => setShowAdd(false)}
          />
        )}
      </div>
    </PhoneShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
