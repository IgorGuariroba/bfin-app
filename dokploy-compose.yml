# Compose usado pelo Dokploy (provider Git) para buildar e rodar a app na VPS.
# O Dokploy clona este repo, builda a imagem da app a partir do Dockerfile e
# sobe só o app. As variáveis ${...} vêm da aba Environment do serviço no Dokploy.
#
# ADR-0017: o serviço db e o volume pgdata moveram para o repo bfin-backend,
# que agora é dono do schema/migrations do mesmo Postgres. O hostname `db` em
# DATABASE_URL continua igual — só passa a ser servido pelo stack do
# bfin-backend na mesma dokploy-network compartilhada. Esse stack precisa
# estar no ar (com healthcheck do db OK) antes deste deploy.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_FARO_URL: ${NEXT_PUBLIC_FARO_URL}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      APIKEY_PEPPER: ${APIKEY_PEPPER}
      CRON_SECRET: ${CRON_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      DISCORD_SUGESTOES_WEBHOOK: ${DISCORD_SUGESTOES_WEBHOOK}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER}
      OTEL_NODE_RESOURCE_DETECTORS: ${OTEL_NODE_RESOURCE_DETECTORS}
      NEXT_PUBLIC_FARO_URL: ${NEXT_PUBLIC_FARO_URL}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET}
      BACKEND_URL: ${BACKEND_URL}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true
